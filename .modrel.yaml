defaults:
  checks:
    - "go test ./..."

modules:
  ".":
    update:
      - 'sh "$MODREL_REPO_ROOT/scripts/release/update-version.sh"'
    commit: "release: {{ .Version }}"

  "examples/hello":
    update:
      - 'sh "$MODREL_REPO_ROOT/scripts/release/update-version.sh"'
    commit: "release(examples/hello): {{ .Version }}"
